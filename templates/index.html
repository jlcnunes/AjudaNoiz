<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AjudaNoiz - Solicitar Suporte</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="client-body">

    <div class="client-card">
        <div class="header-logo">
            <h1>AjudaNoiz 🛠️</h1>
            <p>Suporte técnico rápido e humanizado</p>
        </div>

        <form action="/enviar" method="POST">
            <div class="form-section-title">Seus Dados</div>
            
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Como devemos te chamar?" required>
            </div>

            <div class="grid-2-col">
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Para a fatura" required>
                </div>
                <div class="form-group">
                    <label for="whatsapp">WhatsApp:</label>
                    <input type="tel" id="whatsapp" name="whatsapp" placeholder="(00) 00000-0000" required 
                           maxlength="15" pattern="\(\d{2}\)\s\d{5}-\d{4}">
                </div>
            </div>

            <div class="form-section-title">Sobre o Problema</div>

            <div class="form-group">
                <label for="servico">Tipo de Serviço:</label>
                <select id="servico" name="servico" required>
                    <option value="" disabled selected>Selecione uma opção...</option>
                    <option value="Suporte Windows/Software">Suporte Windows/Software</option>
                    <option value="Redes e Wi-Fi">Redes e Wi-Fi</option>
                    <option value="Manutenção de Hardware">Manutenção de Hardware</option>
                    <option value="Remoção de Vírus">Remoção de Vírus</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>

            <div class="form-group">
                <label for="descricao">Descrição do Problema:</label>
                <textarea id="descricao" name="descricao" rows="3" placeholder="O que está acontecendo?" required></textarea>
            </div>

            <div class="form-group">
                <label for="deseja_agendar">Deseja Agendar?</label>
                <select id="deseja_agendar" name="deseja_agendar" onchange="atualizarDataFinal()" required>
                    <option value="SIM">Sim</option>
                    <option value="NÃO" selected>Não</option>
                </select>
            </div>

            <div class="form-section-title" id="container_agendamento" style="display: none;">
                Agendamento Sugerido

                <div class="grid-2-col">
                    <div class="form-group">
                        <label>Melhor dia:</label>
                        <input type="date" id="data_dia" onchange="atualizarDataFinal()">
                    </div>
                    <div class="form-group">
                        <label>Melhor horário:</label>
                        <select id="hora_cheia" onchange="atualizarDataFinal()">
                            <option value="08:00">08:00</option>
                            <option value="09:00">09:00</option>
                            <option value="10:00">10:00</option>
                            <option value="11:00">11:00</option>
                            <option value="12:00">12:00</option>
                            <option value="13:00">13:00</option>
                            <option value="14:00">14:00</option>
                            <option value="15:00">15:00</option>
                            <option value="16:00">16:00</option>
                            <option value="17:00">17:00</option>
                            <option value="18:00">18:00</option>
                        </select>
                    </div>
                </div>
            </div>
            <input type="hidden" name="data_proposta" id="data_proposta">

            <button type="submit" class="btn-acao btn-full">
                <i class="fas fa-paper-plane"></i> Enviar Solicitação
            </button>
        </form>
    </div>

    <script>
        // Máscara WhatsApp
        const inputZap = document.getElementById('whatsapp');
        inputZap.addEventListener('keyup', (e) => {
            let v = e.target.value.replace(/\D/g, "");
            if (v.length > 0) v = "(" + v;
            if (v.length > 3) v = v.slice(0, 3) + ") " + v.slice(3);
            if (v.length > 10) v = v.slice(0, 10) + "-" + v.slice(10);
            e.target.value = v;
        });

        // Lógica de Data e Validação
        function atualizarDataFinal() {
            const desejaAgendar = document.getElementById('deseja_agendar');
            const containerAgendamento = document.getElementById('container_agendamento');
            const campoDia = document.getElementById('data_dia');
            const campoHora = document.getElementById('hora_cheia');
            const inputHidden = document.getElementById('data_proposta');

            const agora = new Date();
            const hojeData = agora.toISOString().split("T")[0];
            const horaAtual = agora.getHours();
            const limiteExpediente = 18; // Define o fim do expediente

            // 1. Bloqueio dinâmico para o dia atual após o fim do expediente
            if (horaAtual >= limiteExpediente) {
                const amanha = new Date(agora);
                amanha.setDate(amanha.getDate() + 1);
                campoDia.min = amanha.toISOString().split("T")[0];
                
                // Se o usuário já tinha selecionado "Hoje" antes de dar 18h, limpamos
                if (campoDia.value === hojeData) {
                    campoDia.value = "";
                }
            } else {
                campoDia.min = hojeData;
            }

            if (desejaAgendar.value === 'SIM') {
                containerAgendamento.style.display = 'block';

                // Torna obrigatório apenas se o usuário quer agendar
                campoDia.required = true;
                campoHora.required = true;

                if (campoDia.value && campoHora.value) {
                    const horaSelecionada = parseInt(campoHora.value.split(":")[0]);

                    // 2. Validação de Horário de Expediente (Caso ainda existam opções no HTML)
                    if (horaSelecionada > limiteExpediente) {
                        alert("Nosso expediente encerra às 18:00. Por favor, escolha um horário anterior.");
                        campoHora.value = "18:00"; // Reseta para o máximo permitido
                        return;
                    }

                    // 3. Validação de horário retroativo para o dia atual
                    if (campoDia.value === hojeData && horaSelecionada <= horaAtual) {
                        alert("Para hoje, selecione um horário futuro.");
                        campoHora.value = ""; 
                        inputHidden.value = "";
                        return;
                    }

                    // Se tudo estiver OK, alimenta o input que o Python vai ler
                    inputHidden.value = campoDia.value + 'T' + campoHora.value;
                }
            } else {
                containerAgendamento.style.display = 'none';
                inputHidden.value = '';

                // Remove a obrigatoriedade para permitir o envio do formulário
                campoDia.required = false;
                campoHora.required = false;
                
                // Limpa os campos para evitar envio de dados residuais
                campoDia.value = "";
                campoHora.value = "08:00";
            }
        }
        // Inicializa a data mínima ao carregar a página
        document.addEventListener('DOMContentLoaded', () => {
            atualizarDataFinal();
        });
    </script>
</body>
</html>
