<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8"> <!-- Corrigido: era chaset -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Corrigido: era viewerport -->
        <title>AjudaNoiz - Suporte Humanizado</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>
    <body>
        <h1>Solicitar Ajuda 🛠️</h1>
        <p>Preencha os dados abaixo e um técnico entrará em contato.</p>

        <form action="/enviar" method="POST">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required>
            </div>

            <div class="form-group">
                <label for="whatsapp">WhatsApp:</label>
                <input type="tel" 
                    id="whatsapp" 
                    name="whatsapp" 
                    placeholder="(00) 00000-0000" 
                    required 
                    pattern="\(\d{2}\)\s\d{5}-\d{4}" 
                    title="Formato esperado: (00) 00000-0000">
            </div>

            <div class="form-group">
                <label>Deseja agendar o atendimento?</label>
                <select name="deseja_agendar" id="deseja_agendar" onchange="toggleCalendario()">
                    <option value="NÃO">NÃO</option>
                    <option value="SIM">SIM</option>
                </select>
            </div>

            <!-- NOVA ESTRUTURA PARA GARANTIR HORAS CHEIAS -->
            <div id="campo_calendario" style="display:none; margin-top: 15px; border: 1px dashed #ccc; padding: 10px;">
                <div class="form-group">
                    <label for="data_dia">Escolha a data:</label>
                    <input type="date" id="data_dia" onchange="atualizarDataFinal()">
                </div>

                <div class="form-group" style="margin-top: 10px;">
                    <label for="hora_cheia">Escolha o horário:</label>
                    <select id="hora_cheia" onchange="atualizarDataFinal()">
                        <option value="08:00">08:00</option>
                        <option value="09:00">09:00</option>
                        <option value="10:00">10:00</option>
                        <option value="11:00">11:00</option>
                        <option value="12:00">12:00</option>
                        <option value="13:00">13:00</option>
                        <option value="14:00">14:00</option>
                        <option value="15:00">15:00</option>
                        <option value="16:00">16:00</option>
                        <option value="17:00">17:00</option>
                        <option value="18:00">18:00</option>
                    </select>
                </div>
                <!-- Este input oculto envia o valor para o Flask no formato que ele já espera -->
                <input type="hidden" name="data_proposta" id="data_proposta">
            </div>

            <div class="form-group">
                <label for="servico">Tipo de Serviço:</label>
                <select id="servico" name="servico">
                    <option value="suporte_remoto">Suporte Remoto</option>
                    <option value="limpeza_otimizacao">Limpeza e Otimização</option>
                    <option value="configuracao_rede">Configuração de Rede</option>
                    <option value="outro">Outro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="descricao">O que está acontecendo?</label>
                <textarea id="descricao" name="descricao" rows="4" required></textarea>
            </div>
        
            <button class="btn-acao" type="submit">Enviar Solicitação</button> <!-- Corrigido: era submitir -->
        </form>

        <script>
            // 1. MÁSCARA DO WHATSAPP (RESTAURADA)
            const tel = document.getElementById('whatsapp');

            tel.addEventListener('keypress', (e) => {
                let inputLength = tel.value.length;
                // Formato: (XX) XXXXX-XXXX
                if (inputLength === 0) tel.value += '(';
                else if (inputLength === 3) tel.value += ') ';
                else if (inputLength === 10) tel.value += '-';
            });

            tel.addEventListener('input', (e) => {
                // Limita a 15 caracteres e garante que apenas números entrem (além da máscara)
                if (tel.value.length > 15) {
                    tel.value = tel.value.slice(0, 15);
                }
            });

            // 2. LÓGICA DE AGENDAMENTO (COM TRAVA PÓS-18H)
            function toggleCalendario() {
                const select = document.getElementById('deseja_agendar');
                const campo = document.getElementById('campo_calendario');
                const inputDia = document.getElementById('data_dia');
                
                if (select.value === 'SIM') {
                    campo.style.display = 'block';
                    inputDia.required = true;

                    const agora = new Date();
                    const horaAtual = agora.getHours();
                    let dataMinima = agora.toISOString().split("T")[0];

                    // Se for 18h ou mais, bloqueia hoje e sugere amanhã
                    if (horaAtual >= 18) {
                        alert("Atendimento encerrado por hoje. Por favor, selecione uma data a partir de amanhã.");
                        const amanha = new Date(agora);
                        amanha.setDate(amanha.getDate() + 1);
                        dataMinima = amanha.toISOString().split("T")[0];
                        inputDia.value = dataMinima;
                    }

                    inputDia.min = dataMinima;
                } else {
                    campo.style.display = 'none';
                    inputDia.required = false;
                    document.getElementById('data_proposta').value = "";
                }
            }

            function atualizarDataFinal() {
                const campoDia = document.getElementById('data_dia');
                const campoHora = document.getElementById('hora_cheia');
                const inputHidden = document.getElementById('data_proposta');
                
                const diaSelecionado = campoDia.value;
                const horaSelecionada = campoHora.value;

                if (diaSelecionado) {
                    const agora = new Date();
                    const hoje = agora.toISOString().split("T")[0];
                    const horaAtual = agora.getHours();
                    const apenasHora = parseInt(horaSelecionada.split(':')[0]);

                    // Valida se o horário escolhido para HOJE já passou
                    if (diaSelecionado === hoje) {
                        if (apenasHora <= horaAtual) {
                            alert("Por favor, escolha um horário futuro para o atendimento de hoje.");
                            // Sugere a próxima hora cheia se possível
                            campoHora.value = (horaAtual < 17) ? (horaAtual + 1).toString().padStart(2, '0') + ":00" : "08:00";
                            return;
                        }
                    }

                    // Alimenta o campo oculto que o Flask vai ler
                    inputHidden.value = diaSelecionado + 'T' + horaSelecionada;
                }
            }
        </script>
    </body>
</html>
