{% extends "admin.html" %}
{% block content %}
<div class="admin-card">
    <div class="header-logo" style="text-align: left; margin-bottom: 20px;">
        <h2><i class="fas fa-user-edit"></i> Editar Cliente</h2>
        <p>Atualize as informações de contato do cliente abaixo.</p>
    </div>

    <form action="{{ url_for('atualizar_cliente', id=cliente.id) }}" method="POST">
        <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" value="{{ cliente.nome }}" required>
        </div>

        <div class="grid-2-col">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" value="{{ cliente.email }}" required>
            </div>
            <div class="form-group">
                <label for="whatsapp">WhatsApp</label>
                <input type="tel" id="whatsapp" name="whatsapp" value="{{ cliente.whatsapp }}" required 
                maxlength="15" pattern="\(\d{2}\)\s\d{5}-\d{4}">
            </div>
        </div>

        <div style="margin-top: 30px; display: flex; gap: 10px;">
            <button type="submit" class="btn-acao">
                <i class="fas fa-save"></i> Salvar Alterações
            </button>
            <a href="/admin/clientes" class="btn-p-acao" style="background-color: var(--primary); text-decoration: none; display: flex; align-items: center;">
                Cancelar
            </a>
        </div>
    </form>
</div>

<script>
    // Reaproveitando sua máscara de WhatsApp do index.html
    const inputZap = document.getElementById('whatsapp');
    inputZap.addEventListener('keyup', (e) => {
        let v = e.target.value.replace(/\D/g, "");
        if (v.length > 0) v = "(" + v;
        if (v.length > 3) v = v.slice(0, 3) + ") " + v.slice(3);
        if (v.length > 10) v = v.slice(0, 10) + "-" + v.slice(10);
        e.target.value = v;
    });
</script>
{% endblock %}
