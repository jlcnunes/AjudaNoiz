{% extends "admin.html" %}
{% block content %}
<div class="admin-card">
    <h2>👥 Equipe Técnica</h2>
    
    <section style="background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 25px;">
        <h3>➕ Novo Integrante</h3>
        <form action="/admin/usuarios/salvar" method="POST">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" name="nome" required>
                </div>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" name="senha" required>
                </div>
                <div class="form-group">
                    <label>Cargo</label>
                    <select name="cargo">
                        <option value="tecnico">Técnico</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn-acao" style="margin-top: 10px;">💾 Cadastrar</button>
        </form>
    </section>

    <table class="admin-table">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Cargo</th>
                <th>Cadastro</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for usuario in usuarios %}
            <tr>
                <td><strong>{{ usuario.nome }}</strong><br><small>{{ usuario.email }}</small></td>
                <td><span class="badge-status {{ 'status-concluido' if usuario.cargo == 'admin' else 'status-pendente' }}">{{ usuario.cargo }}</span></td>
                <td>{{ usuario.data_cadastro.strftime('%d/%m/%Y') }}</td>
                <td>
                    <form action="{{ url_for('excluir_usuario', id=usuario.id) }}" method="POST" onsubmit="return confirm('Excluir usuário?')">
                        <button type="submit" class="btn-p-acao btn-excluir-mini" title="Excluir">
                            <i class="fas fa-trash"></i></button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
