{% extends "admin.html" %} <!-- Ou o seu layout padrão -->
{% block content %}
<div class="admin-card" style="max-width: 600px; margin: 50px auto;">
    <h2><i class="fas fa-cogs"></i> Configurações do Sistema</h2>
    <hr>
    <form action="{{ url_for('salvar_configuracoes') }}" method="POST">
        <div class="form-group">
            <label for="valor_hora">Valor da Hora Técnica (R$):</label>
            <input type="number" step="0.01" name="valor_hora" id="valor_hora" 
                   value="{{ valor_hora }}" class="form-control" required>
            <small>Este valor será usado para calcular todas as faturas automáticas.</small>
        </div>
        <div style="margin-top: 20px;">
            <button type="submit" class="btn-acao" style="width: 100%; height: 40px; background-color: #25d366;">
                <i class="fas fa-save"></i> Salvar Alterações
            </button>
        </div>
    </form>
</div>
{% endblock %}
