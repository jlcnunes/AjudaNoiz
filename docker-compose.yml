services:
    # Serviço do MySQL
    db:
        image: mysql:8.0.43
        container_name: mysql_db
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: Cpf34221740876
            MYSQL_DATABASE: ajudanoizapp_db
            MYSQL_USER: ajudanoizapp_admin
            MYSQL_PASSWORD: "@ss1st3nc14S3gvra!"
        ports:
            - "3307:3306"
        volumes:
            - ./backend:/docker-entrypoint-initdb.d
            - mysql_data:/var/lib/mysql
    
    # Serviço da aplicação Flask
    web:
        build: .
        image: ajudanoizapp:latest
        container_name: flask_app
        restart: always
        ports:
            - "5000:5000"
        environment:
            - FLASK_APP=backend.app
            - FLASK_ENV=development
            - FLASK_DEBUG=1
            - PYTHONPATH=/app/backend
            - DB_HOST=db
            - DB_PORT=3306
            - DB_USER=ajudanoizapp_admin
            - DB_PASSWORD=@ss1st3nc14S3gvra!
            - ADMIN_NAME=${ADMIN_NAME:?Set ADMIN_NAME in .env}
            - ADMIN_USER=${ADMIN_USER:?Set ADMIN_USER in .env}
            - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}

            # String de conexão configurada para o MySQL apontando para o serviço 'db'
            - DATABASE_URL=mysql+pymysql://ajudanoizapp_admin:@ss1st3nc14S3gvra!@db:3306/ajudanoizapp_db
        volumes:
            - .:/app
        depends_on:
            - db
volumes:
    mysql_data: